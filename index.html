<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist startup Previdia Compact</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f2f4f7; margin: 0; padding: 16px; color: #222; }
  .card { max-width: 560px; margin: 20px auto; background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 2px 10px #0002; }
  h1 { font-size: 1.3em; margin: 0 0 4px; }
  .sub { color: #666; margin: 0 0 16px; }
  .prog { color: #888; font-size: .9em; }
  .q { font-size: 1.2em; margin: 18px 0 24px; min-height: 3em; }
  .btns { display: flex; gap: 12px; }
  button { flex: 1; font-size: 1.2em; padding: 14px; border: 0; border-radius: 10px; color: #fff; cursor: pointer; }
  .si { background: #2e9d4f; }
  .no { background: #d33; }
  .re { background: #456; margin-top: 20px; width: 100%; }
  .item { border-left: 4px solid #d33; padding: 8px 12px; margin: 12px 0; background: #fff5f5; }
  .item b { display: block; margin-bottom: 4px; }
  .ok { color: #2e9d4f; font-size: 1.2em; }
</style>
</head>
<body>
<div class="card" id="app">Caricamento...</div>
<script>
  let D, i = 0, risp = {};
  const app = document.getElementById('app');

  fetch('domande.json?' + Date.now())
    .then(r => r.json())
    .then(j => { D = j; mostra(); })
    .catch(() => { app.innerHTML = 'Errore nel caricamento di domande.json'; });

  function visibile(q) {
    return !q.mostra_se || risp[q.mostra_se.id] === q.mostra_se.risposta;
  }

  function mostra() {
    while (i < D.domande.length && !visibile(D.domande[i])) i++;
    if (i >= D.domande.length) return fine();
    const q = D.domande[i];
    app.innerHTML =
      `<h1>${D.titolo}</h1><p class="sub">${D.sottotitolo}</p>` +
      `<div class="prog">Domanda ${q.id} di ${D.domande.length}</div>` +
      `<div class="q">${q.testo}</div>` +
      `<div class="btns"><button class="si" onclick="r('si')">Sì</button>` +
      `<button class="no" onclick="r('no')">No</button></div>`;
  }

  function r(v) { risp[D.domande[i].id] = v; i++; mostra(); }

  function fine() {
    const no = D.domande.filter(q => visibile(q) && risp[q.id] === 'no' && q.spiegazione_no);
    let h = `<h1>Riepilogo</h1>`;
    h += no.length
      ? `<p class="sub">Ecco cosa preparare prima dello startup:</p>` +
        no.map(q => `<div class="item"><b>${q.id}. ${q.testo}</b>${q.spiegazione_no}</div>`).join('')
      : `<p class="ok">Tutto pronto per lo startup!</p>`;
    app.innerHTML = h + `<button class="re" onclick="i=0;risp={};mostra()">Ricomincia</button>`;
  }
</script>
</body>
</html>
